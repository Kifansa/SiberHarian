<div class="py-6 space-y-6">
  <div class="border-b border-[#BDD8E9]/80 pb-5 flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h2 class="text-xl sm:text-2xl font-black text-[#001D39] tracking-tight">Arsip Keamanan Siber</h2>
      <p class="text-xs sm:text-sm text-[#49769F] mt-1" id="arsip-desc">Pilih tanggal dan filter kategori untuk melihat riwayat ringkasan.</p>
    </div>
    
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <div class="relative">
        <select id="arsip-tanggal-select" class="appearance-none w-full sm:w-64 pl-4 pr-10 py-2.5 rounded-md bg-white border border-[#BDD8E9] text-[#001D39] text-xs font-semibold shadow-2xs focus:outline-none focus:ring-2 focus:ring-[#0A4174]/40 cursor-pointer">
          <option value="">Memuat tanggal...</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#49769F] text-lg" aria-hidden="true">calendar_today</span>
      </div>
      
      <div class="relative">
        <select id="arsip-kategori-select" class="appearance-none w-full sm:w-44 pl-4 pr-10 py-2.5 rounded-md bg-white border border-[#BDD8E9] text-[#001D39] text-xs font-semibold shadow-2xs focus:outline-none focus:ring-2 focus:ring-[#0A4174]/40 cursor-pointer">
          <option value="semua">Semua Kategori</option>
          <option value="insiden_spesifik">Insiden Spesifik</option>
          <option value="edukasi">Edukasi / Evergreen</option>
          <option value="cve">CVE Critical</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#49769F] text-lg" aria-hidden="true">filter_list</span>
      </div>

      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#49769F] text-lg pointer-events-none" aria-hidden="true">search</span>
        <input id="arsip-search-input"
          class="pl-9 pr-10 py-2.5 rounded-md bg-white border border-[#BDD8E9] focus:border-[#7BBDE8] focus:ring-2 focus:ring-[#7BBDE8]/30 outline-none text-xs w-full sm:w-56 transition-all duration-200 placeholder:text-[#49769F] text-[#001D39] shadow-2xs"
          placeholder="Cari arsip..." type="text" aria-label="Cari arsip" />
        <button id="arsip-search-clear" style="display:none;" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-md bg-[#BDD8E9] hover:bg-[#A8CEE5] items-center justify-center text-[#001D39] text-xs cursor-pointer focus-visible:outline-none" title="Bersihkan pencarian" aria-label="Bersihkan pencarian">
          <span class="material-symbols-outlined text-xs" aria-hidden="true">close</span>
        </button>
      </div>
    </div>
  </div>
  <div class="text-center py-16 bg-white rounded-lg border border-[#E2EDF8] shadow-xs hidden" id="arsip-empty-state">
    <div class="text-[#49769F]">
      <span class="material-symbols-outlined text-3xl" aria-hidden="true">calendar_month</span>
    </div>
    <h3 class="text-base font-bold text-[#001D39] mb-1">Belum ada data arsip</h3>
    <p class="text-[#49769F] text-xs">Jalankan pipeline terlebih dahulu untuk mengisi arsip 7 hari terakhir.</p>
  </div>
  <div id="arsip-card-container"></div>
</div>
