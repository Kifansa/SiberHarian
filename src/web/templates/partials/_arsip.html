<div class="py-4 space-y-6">
  <!-- 1. Header Arsip -->
  <div class="border-b border-[#1a3a5c] pb-5 flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h2 class="text-xl sm:text-2xl font-extrabold text-[#e0f0ff] font-['Sora'] uppercase tracking-tight">ARSIP INSIDEN SIBER</h2>
      <p class="text-xs sm:text-sm text-[#8892b0] mt-1" id="arsip-desc">Pilih rentang tanggal penerbitan untuk meninjau riwayat laporan intelijen siber.</p>
    </div>
  </div>

  <!-- 2. Unified Tactical Filter Toolbar -->
  <div class="card-cyber p-4 sm:p-5 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3.5">
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <!-- Select Tanggal Kustom -->
      <div class="relative flex-1 sm:max-w-xs min-w-0">
        <select id="arsip-tanggal-select" class="appearance-none w-full pl-4 pr-11 py-2.5 rounded-lg bg-[#0d2137] hover:bg-[#132c4a] border border-[#1a3a5c] text-[#e0f0ff] text-xs font-mono font-bold shadow-inner focus:outline-none focus:border-[#00d4ff] focus:ring-1 focus:ring-[#00d4ff] cursor-pointer transition-colors truncate">
          <option value="">Memuat tanggal arsip...</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#00d4ff] text-lg shrink-0" aria-hidden="true">calendar_today</span>
      </div>
    </div>

    <!-- Search Input HUD -->
    <div class="relative md:w-80">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#7d8ca6] text-lg pointer-events-none" aria-hidden="true">search</span>
      <input id="arsip-search-input"
        class="pl-9 pr-10 py-2.5 rounded-lg bg-[#0d2137] hover:bg-[#132c4a] focus:bg-[#0d2137] border border-[#1a3a5c] focus:border-[#00d4ff] focus:ring-1 focus:ring-[#00d4ff] outline-none text-xs w-full transition-all duration-200 placeholder:text-[#7d8ca6] text-[#e0f0ff] font-mono shadow-inner"
        placeholder="Cari kata kunci dalam arsip..." type="text" aria-label="Cari arsip" />
      <div class="absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center">
        <button id="arsip-search-clear" style="display:none;" class="w-5 h-5 rounded bg-[#1a3a5c] hover:bg-[#00d4ff]/30 flex items-center justify-center text-[#e0f0ff] text-xs cursor-pointer focus-visible:outline-none" title="Bersihkan pencarian" aria-label="Bersihkan pencarian">
          <span class="material-symbols-outlined text-xs" aria-hidden="true">close</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 3. Empty State (Dark Terminal Style) -->
  <div class="text-center py-16 card-cyber hidden" id="arsip-empty-state">
    <div class="w-14 h-14 mx-auto mb-3 rounded-xl bg-[#0d2137] border border-[#1a3a5c] flex items-center justify-center text-[#00d4ff] shadow-[0_0_15px_rgba(0,212,255,0.2)]">
      <span class="material-symbols-outlined text-2xl" aria-hidden="true">calendar_month</span>
    </div>
    <h3 class="text-base font-bold text-[#e0f0ff] font-['Sora'] mb-1">Belum Ada Data Arsip</h3>
    <p class="text-[#7d8ca6] text-xs max-w-sm mx-auto font-sans">Riwayat artikel dan laporan intelijen akan otomatis tercatat setiap kali pipeline harian dijalankan.</p>
  </div>

  <!-- 4. Card Container -->
  <div id="arsip-card-container"></div>
</div>
