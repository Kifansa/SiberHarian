pipeline:
  window_hours: 19
  request_delay_seconds: 1
  request_timeout: 15
  max_retry: 3
  backoff_factor: 1.5

analytics:
  cti_generation_mode: "modular_llm"  # "modular_llm" (Section-by-section Llama 3.2) atau "instant_rag" (instan RAG <1s)
  timeout_per_section_detik: 45


