# === CTI Analysis Settings ===
cti_analysis:
  llm:
    model: "gemini-3.7-flash"
    temperature: 0.1
    num_predict:
      section_makro: 350
      section_mikro: 500
      section_vektor: 450
      section_emerging: 300
      section_wilayah: 550
    truncation:
      korpus_max: 1500
      fakta_max: 400
      uraian_ancaman_max: 1000
    validation:
      min_length_default: 50
      min_length_mikro: 60
      min_length_vektor: 60
      min_length_emerging: 40
  rag:
    scoring:
      title_match_weight: 3
      body_match_weight: 1
      vector_match_weight: 1
    clustering:
      fuzzy_threshold: 65
      top_n_results: 3
    emerging_threat:
      min_word_length: 4
      growth_threshold: 20.0
    truncation:
      berita_preview: 220
  pasca_proses:
    retention_days: 14


