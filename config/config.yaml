pipeline:
  window_hours: 72
  request_delay_seconds: 1
  request_timeout: 15
  max_retry: 3
  backoff_factor: 1.5

# MEDIA CYBERSECURITY INTERNASIONAL
rss_sources_international:
  - nama: "The Hacker News"
    feeds: ["http://feeds.feedburner.com/TheHackersNews"]
  - nama: "BleepingComputer"
    feeds: ["https://www.bleepingcomputer.com/feed/"]
  - nama: "Krebs on Security"
    feeds: ["https://krebsonsecurity.com/feed/"]
  - nama: "Dark Reading"
    feeds: ["https://www.darkreading.com/rss.xml"]
  - nama: "SecurityWeek"
    feeds: ["https://www.securityweek.com/feed/"]
  - nama: "CISA News"
    feeds:
      - "https://www.cisa.gov/news.xml"
      - "https://www.cisa.gov/cybersecurity-advisories/all.xml" 

# MEDIA NASIONAL INDONESIA
rss_sources_indonesia:
  - nama: "CNN Indonesia"
    feeds:
      - "https://www.cnnindonesia.com/teknologi/rss"
      - "https://www.cnnindonesia.com/nasional/rss"
  - nama: "Antara News"
    feeds:
      - "https://www.antaranews.com/rss/terkini"
      - "https://www.antaranews.com/rss/hukum"
  - nama: "Tempo.co"
    feeds:
      - "https://rss.tempo.co/nasional"
      - "https://rss.tempo.co/tekno"
  - nama: "Sindonews"
    feeds:
      - "https://nasional.sindonews.com/rss"
      - "https://tekno.sindonews.com/rss"
  - nama: "Republika"
    feeds:
      - "https://www.republika.co.id/rss/hukum"
      - "https://www.republika.co.id/rss/teknologi"

google_news:
  hl: "id"
  gl: "ID"
  ceid: "ID:id"
  query_keywords:
    - "kebocoran data"
    - "hacker"
    - "ransomware"
    - "phishing"
    - "diretas"
    - "judi online"
    - "peretas"
    - "dibobol"
    - "dibajak"
    - "serangan siber"
    - "pencurian data"
    - "malware"

cve_source:
  nama: "NVD (National Vulnerability Database)"
  base_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  min_cvss_score: 7.0
  request_timeout: 30

