kategori_map:
  Pencurian & Kebocoran Data Pribadi:
    ecsirt_category: data_breach
    ecsirt_parent: "information-content-security:unauthorized-information-access"
    icon: fingerprint
    desc: "Akses ilegal, pembocoran, dan penjualan data kependudukan atau data sensitif."
    keywords:
      - bocor
      - data pribadi
      - breach
      - dark web
      - dukcapil
      - data breach

  Eksploitasi Celah Keamanan (Zero-Day):
    ecsirt_category: eksploitasi_kerentanan
    ecsirt_parent: "intrusion-attempts:ids-alert"
    icon: bug_report
    desc: "Pemanfaatan celah keamanan (CVE/RCE) pada sistem perangkat lunak atau server."
    keywords:
      - 0-day
      - zero-day
      - rce
      - kerentanan
      - celah keamanan
      - exploit

  Malware & Virus Pencuri Akun:
    ecsirt_category: malware
    ecsirt_parent: "malicious-code:malware"
    icon: pest_control
    desc: "Program jahat penyusup (trojan, infostealer, spyware) perusak perangkat target."
    keywords:
      - malware
      - trojan
      - infostealer
      - stealer
      - virus
      - spyware
      - backdoor

  Web Defacement & Sisipan Judi Online:
    ecsirt_category: defacement
    ecsirt_parent: "intrusions:defacement"
    icon: casino
    desc: "Peretasan tampilan situs web resmi untuk disusupi konten promosi judi atau pesan peretas."
    keywords:
      - deface
      - judi online
      - slot
      - hacked by
      - situs diretas

  Gangguan Layanan & Server (DDoS):
    ecsirt_category: ddos
    ecsirt_parent: "availability:ddos"
    icon: cloud_off
    desc: "Banjir trafik masif yang melumpuhkan portal layanan instansi publik."
    keywords:
      - ddos
      - dos
      - gangguan server
      - server down

  Ransomware & Penyanderaan Sistem:
    ecsirt_category: ransomware
    ecsirt_parent: "malicious-code:ransomware"
    icon: lock
    desc: "Perangkat pemeras yang menyandera/mengenkripsi data dan menuntut tebusan."
    keywords:
      - ransomware
      - tebusan
      - ransom
      - encrypt

  Phishing & Penipuan Digital (APK/Link):
    ecsirt_category: phishing_penipuan
    ecsirt_parent: "fraud:phishing"
    icon: link_off
    desc: "Rekayasa sosial, tautan palsu, dan file APK manipulatif untuk mencuri kredensial & OTP."
    keywords:
      - phishing
      - apk
      - undangan
      - surat tilang
      - social engineering
      - penipuan online

  Pembobolan Akun & Akses Ilegal:
    ecsirt_category: akses_tidak_sah
    ecsirt_parent: "intrusions:account-compromise"
    icon: key
    desc: "Pengambilalihan akun berprivilese dan eskalasi hak akses sistem tanpa izin sah."
    keywords:
      - pembobolan akun
      - akses tidak sah
      - brute force
      - credential stuffing
      - pembajakan akun

stop_words:
  - sistem
  - situs
  - jaringan
  - server
  - aplikasi
  - website
  - dicuri
  - bocor
  - diretas
  - online
  - terkini
  - baru
